[project]
name = "pacific-emis-teacher-registration"
version = "0.1.0"
description = "A standalone but integrated module of the Pacific EMIS for online registration of teachers across the region."
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "django-allauth[socialaccount]>=65.13,<66",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.2,<2",
    "requests>=2.32,<3",
    "weasyprint>=68,<69",
    "reportlab>=4.4,<5",
    "pypdf>=6,<7",
]

[dependency-groups]
dev = [
    "djlint>=1.36,<2",
    "factory-boy>=3.3,<4",
    "pre-commit>=4,<5",
    "pytest>=8,<9",
    "pytest-cov>=6,<7",
    "pytest-django>=4.9,<5",
    "requests-mock>=1.12,<2",
    "time-machine>=2.15,<3",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "pacemis_teacher_registration.settings_test"
python_files = ["test_*.py"]
testpaths = ["accounts", "core", "integrations", "teacher_registration"]
addopts = "--strict-markers"
markers = [
    "pdf: renders a PDF with WeasyPrint; skipped when the native GTK/Pango libraries are missing",
]

[tool.coverage.run]
source = ["accounts", "core", "integrations", "teacher_registration"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
