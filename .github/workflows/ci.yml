name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pacemis_teacher_registration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_DEBUG: "False"
      PG_NAME: pacemis_teacher_registration
      PG_USER: postgres
      PG_PASSWORD: postgres
      PG_HOST: 127.0.0.1
      PG_PORT: "5432"
      EMIS_BASE_URL: https://emis.invalid

    steps:
      - uses: actions/checkout@v4

      - name: Install native libraries for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libfontconfig1

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check requirements.txt is in sync with uv.lock
        run: |
          uv export --format requirements-txt --no-hashes --no-emit-project --no-dev -o requirements.txt
          git diff --exit-code requirements.txt

      - name: Django system checks
        run: uv run python manage.py check

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: uv run pytest --cov --cov-report=term-missing
